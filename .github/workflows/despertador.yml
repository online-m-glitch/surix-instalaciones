name: Despertador Supabase
# Consulta la base una vez por dia para que el proyecto gratis de Supabase no se pause por inactividad.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://kqifzfnkzjnglvbnwprm.supabase.co/rest/v1/inst_instalaciones?select=id&limit=1" \
            -H "apikey: sb_publishable_Iu_xnRRAkSvhYHJqAn99GQ_4wZh4HnZ")
          echo "Respuesta: $code"
          test "$code" = "200"
